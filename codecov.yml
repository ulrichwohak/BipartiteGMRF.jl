# Codecov configuration.
# Docs: https://docs.codecov.com/docs/common-recipe-list#set-project-coverage-checks-on-a-pull-request
#
# Project coverage check on every pull request:
#   - target: auto       — compare against the PR's base commit
#   - threshold: 0%      — coverage must not drop at all
#   - base: auto         — Codecov picks the appropriate base commit
#
# If the 0% threshold proves too strict for Julia's mildly stochastic
# coverage (precompile, conditional include paths), loosen to e.g. 1%.

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0%
        base: auto
